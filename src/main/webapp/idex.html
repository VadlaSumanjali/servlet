<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<form action="Example1" method="get">
        <label for="a">Enter A:</label>
        <input type="number" id="a" name="a" required>
        <br><br>
        <label for="b">Enter B:</label>
        <input type="number" id="b" name="b" required>
        <br><br>
        <label>Select Operation:</label>
        <br>
        <input type="radio" name="operation" value="add" required>
        <label>Add (+)</label>
        <input type="radio" name="operation" value="sub">
        <label>Subtract (-)</label>
        <input type="radio" name="operation" value="mul">
        <label>Multiply (*)</label>
        <input type="radio" name="operation" value="div">
        <label>Divide (/)</label>
        <br><br>
        <button type="submit">Calculate</button>

    </form>
</body>
</html>
